<script>
function toggleMenu() {
  const menu = document.getElementById("navMenu");
  menu.classList.toggle("active");
}

document.addEventListener("click", function(e) {
  const menu = document.getElementById("navMenu");
  const toggle = document.querySelector(".menu-toggle");

  if (!menu.contains(e.target) && !toggle.contains(e.target)) {
    menu.classList.remove("active");
  }
});
</script>

    const container = document.getElementById("fontsContainer");
    const input = document.getElementById("textInput");

    fonts.forEach(font => {
      const style = document.createElement("style");
      style.innerHTML = `
        @font-face {
          font-family: '${font.name}';
          src: url('${font.file}');
        }
      `;
      document.head.appendChild(style);

      const div = document.createElement("div");
      div.classList.add("font-preview");

      div.innerHTML = `
        <div class="eye-btn" onclick="openModal('${font.name}')">👁️</div>
        <div class="font-name">${font.name}</div>
        <div class="preview-text" style="font-family: '${font.name}'">
          Texto de ejemplo
        </div>
      `;

      container.appendChild(div);
    });

    input.addEventListener("input", () => {
      const text = input.value;
      document.querySelectorAll(".preview-text").forEach(el => {
        el.textContent = text || "Texto de ejemplo";
      });
    });

    function openModal(fontName) {
      const modal = document.getElementById("modal");
      const modalText = document.getElementById("modalText");
      const text = input.value || "Texto de ejemplo";

      modalText.textContent = text;
      modalText.style.fontFamily = fontName;

      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function gohome() {
      window.location.href = "../index.html";
    }

    function goBack() {

    }
